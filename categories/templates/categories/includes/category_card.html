<article class="card category-card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="card-title mb-0">
                <span class="me-2">{{ cat.icon }}</span>
                {{ cat.name|default:"Без названия" }}
            </h4>
        </div>

        <p class="card-text text-muted mb-3">
            {{ cat.description }}
        </p>

        <a href="{% url 'categories:detail' cat.id %}" class="btn btn-outline-primary btn-sm">
            Подробнее о категории
        </a>
    </div>
</article>
