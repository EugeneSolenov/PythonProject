{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Семейный календарь{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <div class="container">
        <header class="brand-header">
            <img src="{% static 'homepage/img/logo.png' %}" alt="Логотип Семейный календарь" class="calendar-logo">
            <div>
                <h3 class="mb-0 text-primary fw-bold">Семейный календарь</h3>
                <small class="text-muted">Персональные события, напоминания и памятные даты</small>
            </div>
        </header>

        {% include "includes/navigation.html" %}

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer class="mt-5 mb-4 text-center">
            <p>© <span id="current-year"></span> Семейный календарь. Разработано в рамках ПР5, ПР6 и ПР7.</p>
        </footer>
    </div>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
