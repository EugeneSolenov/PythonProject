<article class="card event-card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h4 class="card-title mb-0">
                {{ event.name|default:"Без названия" }}
            </h4>
            {% include "events/includes/event_status.html" %}
        </div>

        <p class="card-text text-muted mb-2">
            <strong>Категория:</strong> {{ event.category }} | <strong>Дата:</strong> {{ event.event_date }}
        </p>

        <a href="{% url 'events:detail' event.id %}" class="btn btn-primary btn-sm">
            Подробнее
        </a>
    </div>
</article>
